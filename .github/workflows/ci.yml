name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pi-policy-engine:
    name: pi-policy-engine (js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check (node --check over all extension + core files)
        working-directory: extensions/pi-policy-engine
        run: npm run check
      - name: Self test
        working-directory: extensions/pi-policy-engine
        run: node ./scripts/self-test.mjs
      - name: Smoke test (extension lifecycle)
        working-directory: extensions/pi-policy-engine
        run: node ./scripts/smoke-extension.mjs

  pi-quota-status:
    name: pi-quota-status (ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # pi-quota-status ships its own tsconfig + ambient globals.d.ts shim
      # (the pi runtime packages aren't installed under node_modules here;
      # the shim declares their module shape so static checks pass).
      - name: Type check (tsc --noEmit)
        run: npx --yes -p typescript tsc -p extensions/pi-quota-status

  pi-footer-composer:
    name: pi-footer-composer (ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Same ambient-shim pattern as pi-quota-status (AGENTS.md known-gap note).
      - name: Type check (tsc --noEmit)
        run: npx --yes -p typescript tsc -p extensions/pi-footer-composer

  pi-todo:
    name: pi-todo (ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Type check (tsc --noEmit)
        run: npx --yes -p typescript tsc -p extensions/pi-todo

  markdown-lint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # `#` prefix is markdownlint-cli2's documented cross-platform negation.
      # Config ignoreFiles can't exclude dot-dirs like .legacy/ (globby does
      # not match hidden path segments), so exclusions live on the command
      # line. .legacy/ is untracked local-only; kept for local/CI parity.
      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md" "#**/.legacy/**" "#**/node_modules/**"

# Known CI gaps (see AGENTS.md "测试与 CI" for the prescribed fix path):
# - pi-mode-switcher / pi-skill-inject have no type-check infra (no tsconfig
#   or ambient shim). To onboard: copy the pi-quota-status pattern (tsconfig
#   + globals.d.ts) and add a matching job above.
# - Actions are pinned by tag (@v4), not commit SHA: this sandbox cannot
#   reach github.com over HTTPS to resolve authoritative SHAs. Pin them
#   (actions/checkout, actions/setup-node) when network allows.
