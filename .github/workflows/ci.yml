name: ci

# Least privilege: CI only needs to check out; nothing is published
# from here (zizmor excessive-permissions remediation).
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pi-policy-engine:
    name: pi-policy-engine (js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Syntax check (node --check over all extension + core files)
        working-directory: extensions/pi-policy-engine
        run: npm run check
      - name: Unit and extension lifecycle tests
        working-directory: extensions/pi-policy-engine
        run: npm test

  pi-quota-status:
    name: pi-quota-status (ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      # v0.1.0: local-parity gates (same scripts CI runs exist locally —
      # npm run check / npm test, lockfile committed).
      - name: Install
        working-directory: extensions/pi-quota-status
        run: npm ci --no-audit --no-fund
      - name: Type check (tsc --noEmit)
        working-directory: extensions/pi-quota-status
        run: npm run check
      - name: Unit tests (format oracle)
        working-directory: extensions/pi-quota-status
        run: npm test

  pi-footer-composer:
    name: pi-footer-composer (ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      # Same local-parity pattern as pi-quota-status (v0.3.2); the job
      # also runs the layout regression suite that pins the ANSI
      # truncateToWidth infinite-loop fix.
      - name: Install
        working-directory: extensions/pi-footer-composer
        run: npm ci --no-audit --no-fund
      - name: Type check (tsc --noEmit)
        working-directory: extensions/pi-footer-composer
        run: npm run check
      - name: Unit tests (layout oracle)
        working-directory: extensions/pi-footer-composer
        run: npm test

  pi-todo:
    name: pi-todo (ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install
        working-directory: extensions/pi-todo
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: extensions/pi-todo
        run: npm run check
      - name: Unit and interaction tests
        working-directory: extensions/pi-todo
        run: npm test

  pi-notify:
    name: pi-notify (ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install (tsx + @types/node devDeps)
        working-directory: extensions/pi-notify
        run: npm install --no-audit --no-fund
      - name: Type check (tsc --noEmit)
        working-directory: extensions/pi-notify
        run: npm run check
      - name: Unit and terminal protocol tests
        working-directory: extensions/pi-notify
        run: npm test

  pi-context-qos:
    name: pi-context-qos (ts, Node built-ins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install
        working-directory: extensions/pi-context-qos
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: extensions/pi-context-qos
        run: npm run check
      - name: Self test + extension smoke
        working-directory: extensions/pi-context-qos
        run: npm test

  pi-skill-inject:
    name: pi-skill-inject (ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install
        working-directory: extensions/pi-skill-inject
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: extensions/pi-skill-inject
        run: npm run check
      - name: Token boundary tests
        working-directory: extensions/pi-skill-inject
        run: npm test

  pi-mode-switcher:
    name: pi-mode-switcher (ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install
        working-directory: extensions/pi-mode-switcher
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: extensions/pi-mode-switcher
        run: npm run check
      - name: Composite-command risk tests
        working-directory: extensions/pi-mode-switcher
        run: npm test

  markdown-lint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # `#` prefix is markdownlint-cli2's documented cross-platform negation.
      # Config ignoreFiles can't exclude dot-dirs like .legacy/ (globby does
      # not match hidden path segments), so exclusions live on the command
      # line. .legacy/ is untracked local-only; kept for local/CI parity.
      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md" "#**/.legacy/**" "#**/node_modules/**"

# Actions are pinned to the authoritative v4 commit SHAs (resolved via
# api.github.com; see AGENTS.md 已知缺口 — the pin-when-online note is
# now fulfilled and removed).
